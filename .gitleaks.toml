title = "gitleaks nix-config"

[extend]
useDefault = true

# Suppress false positives from the generic-api-key rule across git history.
# Each allowlist is narrowly scoped to a specific pattern or commit.

[[allowlists]]
description = "Pocket ID OAuth client IDs are public UUID identifiers, not secrets"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^vms/immich\.nix$''']
regexTarget = "line"
regexes = ['''(?i)^\s*oauthClientId\s*=\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";\s*$''']

[[allowlists]]
description = "GPG signing key IDs (format: 0x<16 hex chars>) are public identifiers, not secrets"
regexes = ['''(?i)^(?:0x)?[0-9a-f]{16}$''']
regexTarget = "secret"

[[allowlists]]
description = "kubectl --for=condition=<value> argument misidentified as generic-api-key"
regexes = ['''(?i)^condition=\w+$''']
regexTarget = "secret"

[[allowlists]]
description = "Historical deleted CrowdSec bouncer in one legacy commit; verify revocation separately"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^flake\.nix$''']
commits = ["4fe0533f359ee95399872cd0bcd8861a7409f8bc"]
