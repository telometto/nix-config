name: Copilot Auto-Merge

on:
  pull_request_review:
    types: [ submitted ]

concurrency:
  group: copilot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: read
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: |
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' &&
      github.event.review.user.type == 'Bot' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.commit_id == github.event.pull_request.head.sha

    steps:
      - name: Count inline comments on this review
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          n=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/comments?per_page=100" --jq 'map(length) | add // 0')
          echo "count=${n}" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report review for human approval
        id: enable-auto-merge
        if: steps.count.outputs.clean == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: echo 'Copilot review is advisory. A human must review and merge this PR.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report review comments
        id: disable-auto-merge
        if: steps.count.outputs.clean == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: echo 'Resolve review comments before requesting human approval.' >> "$GITHUB_STEP_SUMMARY"
