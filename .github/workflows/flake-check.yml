name: Flake Check
on:
    workflow_dispatch:
    pull_request:
        paths:
            - "**.nix"
            - "flake.lock"
            - "treefmt.nix"
            - ".github/workflows/flake-check.yml"
            - ".github/scripts/evaluate-flake-outputs.sh"
            - ".github/scripts/redact-secrets.sh"
            - "modules/services/scripts/cloudflare_metrics.py"
            - "tests/cloudflare_metrics/**"
            - "tests/crowdsec_*.py"
            - "packages/crowdsec-*/**"
            - "dashboards/host/blizzard/crowdsec.json"
            - "dashboards/host/blizzard/cloudflare-overview.json"
            - "vms/README.md"
            - "docs/**"
            - "tests/matrix-whatsapp-bridge.nix"
            - "docs/adr/**"
    push:
        branches: [main]
        paths:
            - "**.nix"
            - "flake.lock"
            - "treefmt.nix"
            - ".github/workflows/flake-check.yml"
            - ".github/scripts/evaluate-flake-outputs.sh"
            - ".github/scripts/redact-secrets.sh"
            - "modules/services/scripts/cloudflare_metrics.py"
            - "tests/cloudflare_metrics/**"
            - "tests/crowdsec_*.py"
            - "packages/crowdsec-*/**"
            - "dashboards/host/blizzard/crowdsec.json"
            - "dashboards/host/blizzard/cloudflare-overview.json"
            - "vms/README.md"
            - "docs/**"
            - "tests/matrix-whatsapp-bridge.nix"
            - "docs/adr/**"

concurrency:
    group: flake-check-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    flake-check:
        runs-on: ubuntu-latest
        steps:
            - name: Access private repository
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

            - name: Checkout repository
              uses: actions/checkout@v6.0.2

            - name: Install Nix
              uses: DeterminateSystems/nix-installer-action@v22

            - name: Setup Nix cache
              uses: DeterminateSystems/magic-nix-cache-action@v14
              with:
                use-flakehub: false

            - name: Evaluate flake outputs sequentially
              run: bash .github/scripts/evaluate-flake-outputs.sh

            - name: Run Cloudflare metrics tests
              run: nix build .#checks.x86_64-linux.cloudflare-metrics --no-link --print-build-logs

            - name: Run MicroVM publication tests
              run: nix build .#checks.x86_64-linux.microvm-publication --no-link --print-build-logs

            - name: Run Matrix baseline tests
              run: nix build .#checks.x86_64-linux.matrix-baseline --no-link --print-build-logs

            - name: Run Matrix WhatsApp bridge tests
              run: nix build .#checks.x86_64-linux.matrix-whatsapp-bridge --no-link --print-build-logs

            - name: Run Blackbox observability tests
              run: nix build .#checks.x86_64-linux.blackbox-observability --no-link --print-build-logs

            - name: Run CrowdSec HTTP tests
              run: nix build .#checks.x86_64-linux.crowdsec-http --no-link --print-build-logs

            - name: CrowdSec observability checks
              run: nix build .#checks.x86_64-linux.crowdsec-observability --no-link --print-build-logs

            - name: Prepare CrowdSec integration fixture paths
              id: crowdsec-fixtures
              run: |
                  echo "traefik=$(nix build .#nixosConfigurations.blizzard.config.services.traefik.package --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
                  echo "bouncer=$(nix eval --raw .#checks.x86_64-linux.crowdsec-observability.bouncer)" >> "$GITHUB_OUTPUT"
                  echo "alloy=$(nix build .#nixosConfigurations.blizzard.config.services.alloy.package --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
                  echo "vlogs=$(nix build .#nixosConfigurations.blizzard.config.services.victorialogs.package --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
                  echo "crowdsec=$(nix build .#nixosConfigurations.blizzard.config.services.crowdsec.package --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
                  echo "settings=$(nix build .#checks.x86_64-linux.crowdsec-observability.runtimeSettings --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
                  nix eval --raw '.#nixosConfigurations.blizzard.config.environment.etc."alloy/crowdsec.alloy".text' > "$RUNNER_TEMP/crowdsec.alloy"

            - name: Remove private repository credentials
              run: |
                  if [ -n "${SSH_AGENT_PID:-}" ]; then
                      kill "$SSH_AGENT_PID" || true
                  fi
                  printf 'SSH_AUTH_SOCK=\nSSH_AGENT_PID=\n' >> "$GITHUB_ENV"

            - name: Run CrowdSec integration fixtures
              env:
                  TRAEFIK: ${{ steps.crowdsec-fixtures.outputs.traefik }}
                  BOUNCER: ${{ steps.crowdsec-fixtures.outputs.bouncer }}
                  ALLOY: ${{ steps.crowdsec-fixtures.outputs.alloy }}
                  VICTORIALOGS: ${{ steps.crowdsec-fixtures.outputs.vlogs }}
                  CROWDSEC: ${{ steps.crowdsec-fixtures.outputs.crowdsec }}
                  SETTINGS: ${{ steps.crowdsec-fixtures.outputs.settings }}
              run: |
                  env -u SSH_AUTH_SOCK -u SSH_AGENT_PID python3 tests/crowdsec_bouncer_runtime.py --traefik "$TRAEFIK/bin/traefik" --plugin "$BOUNCER"
                  env -u SSH_AUTH_SOCK -u SSH_AGENT_PID python3 tests/crowdsec_logs_runtime.py --alloy "$ALLOY/bin/alloy" --victorialogs "$VICTORIALOGS/bin/victoria-logs" --config "$RUNNER_TEMP/crowdsec.alloy" --settings "$SETTINGS"
                  env -u SSH_AUTH_SOCK -u SSH_AGENT_PID python3 tests/crowdsec_appsec_runtime.py --package "$CROWDSEC" --settings "$SETTINGS"

            - name: Restore private repository credentials for remaining Nix checks
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

            - name: Run MicroVM network policy tests
              run: nix build .#checks.x86_64-linux.microvm-network-policy --no-link --print-build-logs

            - name: Run Sandfly target tests
              run: nix build .#checks.x86_64-linux.sandfly-target --no-link --print-build-logs

            - name: Run Scrutiny tests
              run: nix build .#checks.x86_64-linux.scrutiny --no-link --print-build-logs

            - name: Run user accounts tests
              run: nix build .#checks.x86_64-linux.user-accounts --no-link --print-build-logs

            - name: Run VictoriaMetrics tests
              run: nix build .#checks.x86_64-linux.victoriametrics --no-link --print-build-logs
