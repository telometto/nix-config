name: Flake Check
on:
    workflow_dispatch:
    pull_request:
        paths:
            - "**.nix"
            - "flake.lock"
            - "treefmt.nix"
            - ".github/workflows/flake-check.yml"
            - ".github/scripts/evaluate-flake-outputs.sh"
            - ".github/scripts/redact-secrets.sh"
            - "modules/services/scripts/cloudflare_metrics.py"
            - "tests/cloudflare_metrics/**"
            - "dashboards/host/blizzard/cloudflare-overview.json"
            - "vms/README.md"
            - "docs/adr/**"
    push:
        branches: [main]
        paths:
            - "**.nix"
            - "flake.lock"
            - "treefmt.nix"
            - ".github/workflows/flake-check.yml"
            - ".github/scripts/evaluate-flake-outputs.sh"
            - ".github/scripts/redact-secrets.sh"
            - "modules/services/scripts/cloudflare_metrics.py"
            - "tests/cloudflare_metrics/**"
            - "dashboards/host/blizzard/cloudflare-overview.json"
            - "vms/README.md"
            - "docs/adr/**"

concurrency:
    group: flake-check-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    flake-check:
        runs-on: ubuntu-latest
        steps:
            - name: Access private repository
              uses: webfactory/ssh-agent@v0.9.1
              with:
                  ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

            - name: Checkout repository
              uses: actions/checkout@v6.0.2

            - name: Install Nix
              uses: DeterminateSystems/nix-installer-action@v21

            - name: Setup Nix cache
              uses: DeterminateSystems/magic-nix-cache-action@v13
              with:
                use-flakehub: false

            - name: Evaluate flake outputs sequentially
              run: bash .github/scripts/evaluate-flake-outputs.sh

            - name: Run Cloudflare metrics tests
              run: nix build .#checks.x86_64-linux.cloudflare-metrics --no-link --print-build-logs

            - name: Run MicroVM publication tests
              run: nix build .#checks.x86_64-linux.microvm-publication --no-link --print-build-logs

            - name: Run MicroVM network policy tests
              run: nix build .#checks.x86_64-linux.microvm-network-policy --no-link --print-build-logs

            - name: Run Sandfly target tests
              run: nix build .#checks.x86_64-linux.sandfly-target --no-link --print-build-logs
