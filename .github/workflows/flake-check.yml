name: Flake Check
on:
    workflow_dispatch:
    pull_request:
        paths:
            - "**.nix"
            - "flake.lock"
            - "treefmt.nix"
            - ".github/workflows/flake-check.yml"
            - "modules/services/scripts/cloudflare_metrics.py"
            - "tests/cloudflare_metrics/**"
            - "dashboards/host/blizzard/cloudflare-overview.json"
    push:
        branches: [main]
        paths:
            - "**.nix"
            - "flake.lock"
            - ".github/workflows/flake-check.yml"
            - "modules/services/scripts/cloudflare_metrics.py"
            - "tests/cloudflare_metrics/**"
            - "dashboards/host/blizzard/cloudflare-overview.json"

concurrency:
    group: flake-check-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    flake-check:
        runs-on: ubuntu-latest
        steps:
            - name: Access private repository
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

            - name: Checkout repository
              uses: actions/checkout@v6.0.2

            - name: Install Nix
              uses: DeterminateSystems/nix-installer-action@v22

            - name: Setup Nix cache
              uses: DeterminateSystems/magic-nix-cache-action@v14
              with:
                use-flakehub: false

            - name: Run flake check
              run: |
                  output_file=$(mktemp)
                  trap 'rm -f "$output_file"' EXIT
                  {
                    echo "## 🔍 Flake Check Results"
                    if nix flake check --no-build >"$output_file" 2>&1; then
                      echo "✅ All flake outputs evaluate successfully"
                    else
                      echo "❌ Flake check failed"
                      echo '```'
                      bash .github/scripts/redact-secrets.sh < "$output_file"
                      echo '```'
                      exit 1
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Run Cloudflare metrics tests
              run: nix build .#checks.x86_64-linux.cloudflare-metrics --no-link --print-build-logs

            - name: Run MicroVM publication tests
              run: nix build .#checks.x86_64-linux.microvm-publication --no-link --print-build-logs

            - name: Run Sandfly target tests
              run: nix build .#checks.x86_64-linux.sandfly-target --no-link --print-build-logs

            - name: Run Scrutiny tests
              run: nix build .#checks.x86_64-linux.scrutiny --no-link --print-build-logs
