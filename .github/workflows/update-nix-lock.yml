name: Update Lockfile
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

concurrency:
  group: update-lockfile
  cancel-in-progress: false

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/main'
    environment: trusted-main
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH for private repositories
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Validate update token
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Missing PAT_TOKEN::Configure PAT_TOKEN with Contents and Pull requests read/write access."
            exit 1
          fi

          if ! can_push=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push // false'); then
            echo "::error title=Invalid PAT_TOKEN::PAT_TOKEN is expired, revoked, or cannot access ${GITHUB_REPOSITORY}."
            exit 1
          fi

          if [ "$can_push" != "true" ]; then
            echo "::error title=Insufficient PAT_TOKEN permissions::PAT_TOKEN needs Contents and Pull requests read/write access."
            exit 1
          fi

      - name: Checkout main repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        id: update-flake-lock
        with:
          commit-msg: "🧹 chore(flake.lock): update"
          pr-body: |
            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
          pr-title: "🧹 chore(flake.lock): update"
          pr-labels: maintenance
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get commit message for compare URLs
        if: steps.update-flake-lock.outputs.pull-request-operation == 'created' || steps.update-flake-lock.outputs.pull-request-operation == 'updated'
        id: get-commit-message
        env:
          PR_NUMBER: ${{ steps.update-flake-lock.outputs.pull-request-number }}
        run: |
          PR_BRANCH="update_flake_lock_action"
          git fetch origin "${PR_BRANCH}:${PR_BRANCH}" || git fetch origin

          COMMIT_MSG=$(git log --format=%B -n 1 "${PR_BRANCH}" 2>/dev/null || git log --format=%B -n 1 HEAD)
          {
            echo "commit-message<<EOF"
            echo "$COMMIT_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "pr-branch=${PR_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create compare URLs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        if: steps.update-flake-lock.outputs.pull-request-operation == 'created' || steps.update-flake-lock.outputs.pull-request-operation == 'updated'
        env:
          GIT_COMMIT_MESSAGE: ${{ steps.get-commit-message.outputs.commit-message }}
          PULL_REQUEST_NUMBER: ${{ steps.update-flake-lock.outputs.pull-request-number }}
          PR_BRANCH: ${{ steps.get-commit-message.outputs.pr-branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = require('.github/scripts/comment')
            const compare = require('.github/scripts/compare')

            const urls = await compare({ core })
            if (!urls?.length) {
              core.info('No compare URLs to add')
              return
            }

            const header = "## 🔗 Compare URLs"
            const body = urls.map((url) => `- ${url}`).join("\n")

            const issueNumber = parseInt(process.env.PULL_REQUEST_NUMBER, 10)
            if (Number.isNaN(issueNumber)) {
              core.error('Could not determine PR number')
              return
            }

            core.info(`Adding compare URLs to PR #${issueNumber}`)
            await comment({ github, context, header, body, issueNumber })
