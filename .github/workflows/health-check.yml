name: Infrastructure Health Check
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  discover-hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.matrix }}
    steps:
      - name: Checkout flake.nix
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: flake.nix
          sparse-checkout-cone-mode: false

      - name: Extract host list
        id: hosts
        run: |
          hosts=$(grep -oP '^\s+\K\w+(?=\s*=\s*mkHost)' flake.nix)
          matrix=$(echo "$hosts" | jq -R . | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-hosts:
    runs-on: ubuntu-latest
    needs: discover-hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.discover-hosts.outputs.hosts) }}
    steps:
      - name: Access private repository
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Checkout main repository
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Maximize disk space
        run: |
          HOST="${{ matrix.host }}"
          echo "## 📦 Disk Usage (${HOST}) - before cleanup" >> $GITHUB_STEP_SUMMARY
          df -h >> $GITHUB_STEP_SUMMARY

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /home/linuxbrew || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/graalvm || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /opt/pipx || true
          sudo rm -rf /opt/google || true
          sudo rm -rf /usr/lib/google-cloud-sdk || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/share/az_* || true
          sudo rm -rf /usr/share/gradle-* || true
          sudo rm -rf /usr/share/sbt || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          echo "## ♻️ Disk Usage (${HOST}) - after cleanup" >> $GITHUB_STEP_SUMMARY
          df -h >> $GITHUB_STEP_SUMMARY

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Expand build sandbox for avalanche
        if: matrix.host == 'avalanche'
        run: |
          # avalanche uses features that require relaxed sandboxing
          mkdir -p ~/.config/nix
          cat <<'EOF' >> ~/.config/nix/nix.conf
          sandbox = false
          EOF

      - name: Build ${{ matrix.host }}
        run: |
          HOST="${{ matrix.host }}"
          echo "## 🏗️ Build Results - ${HOST}" >> $GITHUB_STEP_SUMMARY

          nix-collect-garbage -d || true
          build_output=$(mktemp)
          trap 'rm -f "$build_output"' EXIT

          if nix build ".#nixosConfigurations.${HOST}.config.system.build.toplevel" --no-link --print-build-logs --max-jobs 2 >"$build_output" 2>&1; then
            echo "✅ ${HOST}: Build successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ ${HOST}: Build failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            bash .github/scripts/redact-secrets.sh < "$build_output" | tail -n 200 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Collect Nix garbage
        if: always()
        run: |
          nix store gc || nix-collect-garbage || true
          df -h

  health-summary:
    runs-on: ubuntu-latest
    needs: build-hosts
    if: always()
    steps:
      - name: Synchronize health-check issue
        # Skipped or cancelled builds are neither failures nor recoveries.
        if: >-
          needs.build-hosts.result == 'failure' ||
          needs.build-hosts.result == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BUILD_RESULT: ${{ needs.build-hosts.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const result = process.env.BUILD_RESULT;
            const title = '🚨 Infrastructure Health Check Failed';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (result !== 'failure' && result !== 'success') {
              throw new Error(`Unexpected build result: ${result}`);
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo,
              state: 'open',
              labels: 'infrastructure',
              creator: 'github-actions[bot]',
              per_page: 100,
            });

            const existing = issues.filter(
              issue => !issue.pull_request && issue.title === title,
            );

            if (result === 'failure') {
              if (existing.length > 0) {
                for (const issue of existing) {
                  await github.rest.issues.createComment({
                    owner, repo,
                    issue_number: issue.number,
                    body: `Build failure detected again.\n\n**Workflow run:** ${runUrl}`,
                  });
                }
              } else {
                const body = `Automated health check detected build failures.\n\n**Workflow run:** ${runUrl}\n\nPlease review the workflow run for details.`;
                await github.rest.issues.create({
                  owner, repo, title, body,
                  labels: ['infrastructure', 'urgent'],
                });
              }

              return;
            }

            if (existing.length === 0) {
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;
            const defaultRef = `refs/heads/${defaultBranch}`;

            if (context.ref !== defaultRef) {
              core.notice(`Skipping recovery: ${context.ref} is not ${defaultRef}.`);
              return;
            }

            const { data: head } = await github.rest.git.getRef({
              owner, repo,
              ref: `heads/${defaultBranch}`,
            });

            if (context.sha !== head.object.sha) {
              core.notice(
                `Skipping recovery: ${context.sha} is not the current ` +
                `${defaultBranch} head (${head.object.sha}).`,
              );
              return;
            }

            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issue.number,
                body: `Health check recovered successfully.\n\n**Workflow run:** ${runUrl}`,
              });

              await github.rest.issues.update({
                owner, repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
